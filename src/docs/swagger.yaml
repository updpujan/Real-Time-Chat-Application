openapi: 3.0.0

info:
  title: Real-Time Chat Application API
  version: 1.0.0
  description: REST API documentation for the Real-Time Chat Application

servers:
  - url: http://localhost:3000

paths:
  /health:
    get:
      summary: Check server and database health
      description: Checks whether the application server and PostgreSQL database are available.
      tags:
        - Health

      responses:
        '200':
          description: Server and database are healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  server:
                    type: string
                    example: up
                  database:
                    type: string
                    example: up

        '503':
          description: Services unavailable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unhealthy
                  server:
                    type: string
                    example: up
                  database:
                    type: string
                    example: down
