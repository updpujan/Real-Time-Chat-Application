<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account | Real-Time Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="form-card">
        <a class="brand-mark" href="/">Real-Time Chat</a>
        <p class="eyebrow">Get started</p>
        <h1>Create your account</h1>
        <p class="muted">Join the conversation in a few seconds.</p>
        <form id="register-form" class="auth-form">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required />
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
          />
          <p class="field-help">
            Use 8–20 characters with uppercase, lowercase, a number, and a special character.
          </p>
          <button class="button button-primary button-full" type="submit">Create account</button>
        </form>
        <p class="form-footer">Already have an account? <a href="/login.html">Log in</a></p>
      </section>
    </main>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
