<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | Real-Time Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="form-card">
        <a class="brand-mark" href="/">Real-Time Chat</a>
        <p class="eyebrow">Welcome back</p>
        <h1>Log in to your account</h1>
        <p class="muted">Continue your conversations where you left off.</p>
        <form id="login-form" class="auth-form">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <button class="button button-primary button-full" type="submit">Log in</button>
        </form>
        <p class="form-footer">New here? <a href="/register.html">Create an account</a></p>
      </section>
    </main>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
